<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndianPol — MP Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1119;
  --bg-elev:#0E1826;
  --panel:#121F30;
  --panel-hover:#17283D;
  --border:#213247;
  --border-soft:#182534;
  --text:#EAF0F6;
  --text-dim:#8FA2B8;
  --text-faint:#54607A;
  --teal:#33CE9F;
  --teal-dim:rgba(51,206,159,.13);
  --gold:#CBA24E;
  --gold-dim:rgba(203,162,78,.15);
  --red:#E4695D;
  --red-dim:rgba(228,105,93,.14);
  --blue:#5D93F2;
  --blue-dim:rgba(93,147,242,.13);
  --radius:7px;
  --radius-sm:4px;
  --sans:'IBM Plex Sans',-apple-system,sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --serif:'Newsreader',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:13.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--teal-dim);color:var(--teal);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text);}

/* ---------- APP SHELL ---------- */
#app{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
#sidebar{
  width:236px;flex:none;background:var(--bg-elev);
  border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;
  height:100vh;transition:width .18s ease;
}
.brand{
  padding:18px 18px 14px 18px;
  border-bottom:1px solid var(--border-soft);
}
.brand-mark{display:flex;align-items:center;gap:9px;}
.brand-glyph{
  width:26px;height:26px;border-radius:6px;
  background:linear-gradient(155deg,#1B2E45,#0E1826);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-style:italic;font-size:14px;color:var(--gold);
}
.brand-name{font-weight:600;font-size:14.5px;letter-spacing:.01em;}
.brand-sub{font-size:10.5px;color:var(--text-faint);margin-top:2px;padding-left:1px;}
.demo-chip{
  margin-top:10px;display:inline-flex;align-items:center;gap:5px;
  background:var(--gold-dim);color:var(--gold);border:1px solid rgba(203,162,78,.3);
  padding:3px 8px;border-radius:20px;font-size:10px;font-weight:500;
}
.demo-chip::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold);}

.nav-scroll{flex:1;overflow-y:auto;padding:10px 10px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:var(--radius-sm);
  color:var(--text-dim);font-size:13px;cursor:pointer;
  border:1px solid transparent;
}
.nav-item:hover{background:var(--panel-hover);color:var(--text);}
.nav-item.active{background:var(--panel);color:var(--text);border-color:var(--border);}
.nav-item.active .nav-dot{background:var(--teal);}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--text-faint);flex:none;}
.nav-item .nav-badge{
  margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-faint);
  background:var(--bg);border:1px solid var(--border-soft);padding:1px 6px;border-radius:10px;
}
.nav-item.active .nav-badge{color:var(--teal);border-color:rgba(51,206,159,.3);}
.nav-item .nav-badge.urgent{color:var(--gold);border-color:rgba(203,162,78,.35);}
.nav-divider{height:1px;background:var(--border-soft);margin:8px 4px;}

.sidebar-footer{padding:12px;border-top:1px solid var(--border-soft);}
.role-box{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 10px;
}
.role-box label{display:block;font-size:9.5px;color:var(--text-faint);margin-bottom:4px;}
.role-box select{
  width:100%;background:transparent;border:none;color:var(--text);font-size:12.5px;font-weight:500;
  outline:none;
}
.role-box select option{background:var(--panel);}

/* MAIN */
#main-wrap{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#topbar{
  height:56px;flex:none;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--bg);
}
.topbar-title{font-weight:600;font-size:15px;}
.topbar-sub{font-size:11.5px;color:var(--text-faint);}
#search-wrap{flex:1;max-width:420px;position:relative;margin-left:8px;}
#global-search{
  width:100%;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 34px 7px 30px;font-size:12.5px;color:var(--text);
  outline:none;
}
#global-search:focus{border-color:var(--teal);}
#search-wrap::before{
  content:'';position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:11px;height:11px;border:1.5px solid var(--text-faint);border-radius:50%;
}
#search-wrap::after{
  content:'';position:absolute;left:19px;top:63%;width:5px;height:1.5px;background:var(--text-faint);
  transform:rotate(45deg);
}
.kbd-hint{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:9.5px;color:var(--text-faint);border:1px solid var(--border);padding:1px 5px;border-radius:3px;pointer-events:none;}
#search-results{
  position:absolute;top:36px;left:0;right:0;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius);
  max-height:400px;overflow-y:auto;display:none;z-index:50;
  box-shadow:0 12px 32px rgba(0,0,0,.45);
}
#search-results.show{display:block;}
.sr-group{padding:6px 10px;}
.sr-group-title{font-size:10px;color:var(--text-faint);padding:6px 4px 4px;}
.sr-item{padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:12.5px;}
.sr-item:hover{background:var(--panel-hover);}
.sr-item .sr-meta{color:var(--text-faint);font-size:11px;}
.sr-ask{margin:4px 10px 8px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--teal-dim);color:var(--teal);font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(51,206,159,.3);}

.topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.icon-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--panel);display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);position:relative;font-size:13px;
}
.icon-btn:hover{background:var(--panel-hover);color:var(--text);}
.icon-btn .dot{
  position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;
  background:var(--red);border:1.5px solid var(--bg);
}
.avatar{
  width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,#1E3350,#0E1826);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:600;color:var(--gold);
}
#notif-panel{
  position:absolute;top:52px;right:70px;width:340px;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius);z-index:60;display:none;
  box-shadow:0 12px 32px rgba(0,0,0,.45);
}
#notif-panel.show{display:block;}
.notif-head{padding:12px 14px;border-bottom:1px solid var(--border-soft);font-weight:600;font-size:13px;}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:12px;display:flex;gap:8px;}
.notif-item:last-child{border-bottom:none;}
.notif-item .ndot{width:6px;height:6px;border-radius:50%;background:var(--teal);margin-top:5px;flex:none;}
.notif-time{color:var(--text-faint);font-size:10.5px;margin-top:2px;}

#content{flex:1;overflow-y:auto;padding:22px 26px 60px;}

/* ---------- SHARED COMPONENTS ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:19px;font-weight:600;letter-spacing:-.01em;}
.page-desc{color:var(--text-dim);font-size:12.5px;margin-top:3px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12.5px;font-weight:500;
  transition:background .12s ease;
}
.btn:hover{background:var(--panel-hover);}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#06201A;font-weight:600;}
.btn-primary:hover{background:#3DE0AF;}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#241A05;font-weight:600;}
.btn-gold:hover{background:#DBB25E;}
.btn-red{background:transparent;border-color:rgba(228,105,93,.4);color:var(--red);}
.btn-red:hover{background:var(--red-dim);}
.btn-ghost{background:transparent;}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-5{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;}
.card-tight{padding:12px 14px;}
.stat-card .stat-label{font-size:11px;color:var(--text-faint);margin-bottom:8px;}
.stat-card .stat-value{font-family:var(--mono);font-size:26px;font-weight:600;}
.stat-card.compact .stat-value{font-size:20px;}
.stat-card .stat-foot{font-size:11px;color:var(--text-dim);margin-top:6px;}
.stat-card .stat-foot.up{color:var(--teal);}
.stat-card .stat-foot.warn{color:var(--gold);}
.stat-card .stat-foot.bad{color:var(--red);}

.section-title{font-size:13.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.section-title .link{font-size:11.5px;font-weight:500;color:var(--teal);cursor:pointer;}

.tag{
  display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:500;
  border:1px solid transparent;white-space:nowrap;
}
.tag-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(51,206,159,.3);}
.tag-gold{background:var(--gold-dim);color:var(--gold);border-color:rgba(203,162,78,.3);}
.tag-red{background:var(--red-dim);color:var(--red);border-color:rgba(228,105,93,.3);}
.tag-blue{background:var(--blue-dim);color:var(--blue);border-color:rgba(93,147,242,.3);}
.tag-gray{background:var(--bg-elev);color:var(--text-dim);border-color:var(--border);}

.ai-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.02em;font-weight:600;
  color:var(--blue);background:var(--blue-dim);border:1px solid rgba(93,147,242,.3);
  padding:2px 7px;border-radius:4px;
}
.ai-chip::before{content:'◆';font-size:7px;}
.ai-chip.summary{color:var(--teal);background:var(--teal-dim);border-color:rgba(51,206,159,.3);}
.ai-chip.suggestion{color:var(--gold);background:var(--gold-dim);border-color:rgba(203,162,78,.3);}
.ai-box{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;}
.ai-box .ai-text{font-size:12.5px;color:var(--text-dim);margin-top:8px;line-height:1.6;white-space:pre-line;}
.ai-loading{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:8px;padding:8px 0;}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--teal);animation:spin .7s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg);}}

table{width:100%;border-collapse:collapse;}
th{
  text-align:left;font-size:10.5px;color:var(--text-faint);font-weight:500;
  padding:0 10px 8px;border-bottom:1px solid var(--border-soft);
}
td{padding:10px 10px;border-bottom:1px solid var(--border-soft);font-size:12.5px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-hover:hover{background:var(--panel-hover);cursor:pointer;}

.list-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border-soft);}
.list-row:last-child{border-bottom:none;}
.list-row.row-hover{cursor:pointer;border-radius:var(--radius-sm);}
.list-row.row-hover:hover{background:var(--panel-hover);}
.row-time{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);width:60px;flex:none;}
.row-main{flex:1;min-width:0;}
.row-title{font-size:12.5px;font-weight:500;}
.row-sub{font-size:11px;color:var(--text-faint);margin-top:1px;}

.empty{padding:32px 10px;text-align:center;color:var(--text-faint);font-size:12px;}
.empty .empty-title{color:var(--text-dim);font-size:13px;margin-bottom:4px;font-weight:500;}

.progress-track{height:5px;background:var(--bg-elev);border-radius:4px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;background:var(--teal);border-radius:4px;}
.progress-fill.warn{background:var(--gold);}
.progress-fill.full{background:var(--red);}

.checklist-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border-soft);}
.checklist-item:last-child{border-bottom:none;}
.check-circle{
  width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bg);
}
.check-circle.done{background:var(--teal);border-color:var(--teal);}
.check-circle.current{border-color:var(--gold);}
.check-label{font-size:12.5px;}
.check-label.done{color:var(--text-dim);}
.check-label.current{color:var(--text);font-weight:500;}

/* TIMELINE */
.tl{position:relative;padding-left:18px;}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-14px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--teal);}
.tl-item::after{content:'';position:absolute;left:-11.5px;top:12px;bottom:-4px;width:1px;background:var(--border-soft);}
.tl-item:last-child::after{display:none;}
.tl-date{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
.tl-text{font-size:12.5px;margin-top:2px;}

/* HERO / BRIEFING */
.hero-card{
  background:linear-gradient(150deg,var(--panel) 0%,var(--bg-elev) 100%);
  border:1px solid var(--border-soft);border-radius:10px;padding:22px 24px;margin-bottom:18px;
  position:relative;overflow:hidden;
}
.hero-eyebrow{font-size:11px;color:var(--text-faint);margin-bottom:6px;}
.hero-greeting{font-family:var(--serif);font-style:italic;font-size:23px;color:var(--text);margin-bottom:14px;}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:6px;}
.hero-stat b{font-family:var(--mono);font-size:20px;display:block;color:var(--text);}
.hero-stat span{font-size:11px;color:var(--text-faint);}
.briefing-box{
  margin-top:16px;background:var(--bg);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:14px 16px;display:none;
}
.briefing-box.show{display:block;}
.briefing-box ul{list-style:none;margin-top:8px;}
.briefing-box li{padding:4px 0 4px 14px;position:relative;font-size:12.5px;color:var(--text-dim);}
.briefing-box li::before{content:'—';position:absolute;left:0;color:var(--text-faint);}

/* MODALS */
.overlay{
  position:fixed;inset:0;background:rgba(4,8,13,.65);backdrop-filter:blur(2px);
  display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto;
}
.overlay.show{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.modal.modal-lg{max-width:780px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-soft);gap:10px;}
.modal-head h3{font-size:14.5px;font-weight:600;}
.modal-head .mh-sub{font-size:11px;color:var(--text-faint);margin-top:2px;font-weight:400;}
.modal-close{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-faint);border:1px solid var(--border);background:transparent;flex:none;}
.modal-close:hover{background:var(--panel-hover);color:var(--text);}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
.modal-foot.between{justify-content:space-between;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 10px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.mtabbar{display:flex;gap:2px;border-bottom:1px solid var(--border-soft);padding:0 20px;overflow-x:auto;}
.mtab{padding:9px 10px;font-size:11.5px;color:var(--text-dim);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
.mtab:hover{color:var(--text);}
.mtab.active{color:var(--text);border-color:var(--teal);font-weight:500;}

/* TOAST */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--teal);
  border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  min-width:240px;animation:toastin .25s ease;
}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* TABS */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border-soft);margin-bottom:16px;overflow-x:auto;}
.tab{padding:8px 12px;font-size:12.5px;color:var(--text-dim);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-color:var(--teal);font-weight:500;}

/* CHAT (AI Assistant) */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 180px);border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--panel);}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
.chat-msg{max-width:78%;font-size:12.5px;line-height:1.55;}
.chat-msg.user{align-self:flex-end;background:var(--teal-dim);color:var(--text);border:1px solid rgba(51,206,159,.25);border-radius:10px 10px 2px 10px;padding:9px 13px;}
.chat-msg.ai{align-self:flex-start;background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:10px 10px 10px 2px;padding:11px 14px;white-space:pre-line;}
.chat-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 12px;}
.chip-btn{border:1px solid var(--border);background:var(--bg-elev);color:var(--text-dim);padding:5px 10px;border-radius:20px;font-size:11px;}
.chip-btn:hover{border-color:var(--teal);color:var(--teal);}
.chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border-soft);}
.chat-input-row input{flex:1;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;outline:none;}
.chat-input-row input:focus{border-color:var(--teal);}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-daylabel{font-size:10.5px;color:var(--text-faint);text-align:center;padding-bottom:4px;}
.cal-cell{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius-sm);min-height:88px;padding:6px;font-size:11px;}
.cal-cell.today{border-color:var(--teal);}
.cal-date{color:var(--text-faint);font-size:10.5px;margin-bottom:4px;}
.cal-cell.today .cal-date{color:var(--teal);font-weight:600;}
.cal-evt{background:var(--panel-hover);border-left:2px solid var(--blue);padding:2px 5px;border-radius:2px;margin-bottom:3px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-evt.official{border-color:var(--gold);}
.cal-evt.constituency{border-color:var(--teal);}
.cal-evt.visit{border-color:var(--red);}

/* MISC */
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--border-soft);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-faint);flex:none;}
.kv .v{text-align:right;}
.divider{height:1px;background:var(--border-soft);margin:16px 0;}
.role-note{font-size:11px;color:var(--text-faint);margin-top:4px;}
.avatar-sm{width:26px;height:26px;border-radius:50%;background:var(--bg-elev);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--gold);flex:none;}
.attn-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border-soft);cursor:pointer;border-radius:var(--radius-sm);}
.attn-item:last-child{border-bottom:none;}
.attn-item:hover{background:var(--panel-hover);}
.attn-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.attn-dot.red{background:var(--red);}
.attn-dot.gold{background:var(--gold);}
.attn-dot.blue{background:var(--blue);}
.link-mini{color:var(--teal);font-size:11px;cursor:pointer;}
.note-item{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;margin-bottom:6px;color:var(--text-dim);}

@media(max-width:860px){
  #sidebar{width:64px;}
  #sidebar .brand-name,#sidebar .brand-sub,#sidebar .demo-chip,#sidebar .nav-item span:not(.nav-dot),#sidebar .nav-badge,#sidebar .role-box label,#sidebar .role-box select{display:none;}
  #sidebar .brand{padding:14px 10px;display:flex;justify-content:center;}

  #content{padding:16px;}
}

function esc(s){return String(s==null?'—':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){
  const w=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  w.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3200);
}
function log(text){

  DB.auditLog.unshift({time:`${hh}:${mm}`,text});
}
function priorityTag(p){ const map={High:'tag-red',Medium:'tag-gold',Low:'tag-gray'}; return `<span class="tag ${map[p]||'tag-gray'}">${p}</span>`; }
function statusTag(s){
  const map={
    Confirmed:'tag-teal',Pending:'tag-gold',New:'tag-blue',Assigned:'tag-gold',
    "In Progress":'tag-blue',"Follow-up":'tag-red',Resolved:'tag-teal',Closed:'tag-gray',
    Planning:'tag-gold',Requested:'tag-blue',Unread:'tag-gold',Read:'tag-gray',
    Incoming:'tag-blue',Draft:'tag-gray',"Pending Approval":'tag-gold',Dispatched:'tag-teal',
    "Awaiting Response":'tag-gold',Overdue:'tag-red',Rejected:'tag-red',Approved:'tag-teal',
    NEW:'tag-blue',"AI ANALYZED":'tag-blue',ASSIGNED:'tag-gold',"ACTION REQUIRED":'tag-red',WAITING:'tag-gold',COMPLETED:'tag-teal',
    "AI Prepared":'tag-blue',"Staff Review":'tag-gold',"Authorized Approval":'tag-gold',
  };
  return `<span class="tag ${map[s]||'tag-gray'}">${s}</span>`;
}
function aiChip(label,variant){ return `<span class="ai-chip ${variant||''}">${label}</span>`; }
function canApprove(){ return ROLES.find(r=>r.id===currentRole).approve; }
function findDept(id){ return DB.departments.find(d=>d.id===id); }
function findCase(id){ return DB.cases.find(c=>c.id===id); }
function findPerson(name){ return DB.people.find(p=>p.name===name); }
function findVisit(id){ return DB.visits.find(v=>v.id===id); }
function caseAge(days,status){ return (days>15 && status!=='Resolved'); }

/* generic "AI is working" placeholder swap: replaces el content, waits, then runs cb */
function aiWork(btn, label, cb){
  const original = btn.outerHTML;
  const holder = document.createElement('span');
  holder.className='ai-loading'; holder.innerHTML = `<span class="spin"></span> ${label||'AI is analyzing…'}`;
  btn.replaceWith(holder);
  setTimeout(()=>{ cb(); }, 550);
}

========================================================= */
function renderSidebar(){
  const nav=document.getElementById('nav-scroll');
  nav.innerHTML = NAV.map(n=>{
    const badge = n.badge ? n.badge() : null;
    const urgent = (n.id==='approvals'||n.id==='inbox') && badge;
    return `<div class="nav-item ${route===n.id?'active':''}" data-nav="${n.id}">
      <span class="nav-dot"></span><span>${n.label}</span>
      ${badge?`<span class="nav-badge ${urgent?'urgent':''}">${badge}</span>`:''}
    </div>`;
  }).join('');

  const sel=document.getElementById('role-select');
  if(!sel.dataset.init){
    sel.innerHTML = ROLES.map(r=>`<option value="${r.id}">${r.label}</option>`).join('');
    sel.value = currentRole;
    sel.dataset.init="1";
    sel.addEventListener('change',()=>{ currentRole=sel.value; renderAll(); toast(`Now viewing as ${ROLES.find(r=>r.id===currentRole).label}`); });
  }
}
function renderTopbar(){
  const n = NAV.find(x=>x.id===route);
  document.getElementById('tb-title').textContent = n.label;
  document.getElementById('tb-sub').textContent = `${OFFICE.officeName} · ${OFFICE.constituency}, ${OFFICE.state}`;
  document.getElementById('notif-dot').style.display = DB.notifications.length? 'block':'none';
}

/* =========================================================
   PAGE: CALENDAR
========================================================= */
function pageCalendar(){
  const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const today = new Date();
  const startOfWeek = new Date(today); startOfWeek.setDate(today.getDate()-today.getDay());
  const evts = {
    [today.getDate()]: [["09:30 Ramesh Pandey","official"],["10:15 Sunita Devi","constituency"],["13:00 Jhajha Visit","visit"],["16:00 Delegation","official"]]
  };
  let cells='';
  for(let i=0;i<7;i++){
    const d=new Date(startOfWeek); d.setDate(startOfWeek.getDate()+i);
    const isToday = d.toDateString()===today.toDateString();
    const dayEvts = isToday ? evts[today.getDate()]||[] : [];
    cells += `<div class="cal-cell ${isToday?'today':''}">
      <div class="cal-date">${d.getDate()}</div>
      ${dayEvts.map(([t,c])=>`<div class="cal-evt ${c}">${t}</div>`).join('')}
      ${!isToday && i===2 ? `<div class="cal-evt">10:00 Chakai prep call</div>`:''}
    </div>`;
  }
  return `
  <div class="page-head">
    <div><div class="page-title">Calendar</div><div class="page-desc">Week of ${startOfWeek.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div></div>
    <div style="display:flex;gap:6px;"><span class="tag tag-gold">Official</span><span class="tag tag-teal">Constituency</span><span class="tag tag-red">Visit</span></div>
  </div>
  <div class="card">
    <div class="cal-grid">${days.map(d=>`<div class="cal-daylabel">${d}</div>`).join('')}</div>
    <div class="cal-grid" style="margin-top:4px;">${cells}</div>
  </div>
  <div class="card" style="margin-top:16px;">
    <div class="section-title">Today, in order</div>
    ${DB.appointments.map(a=>`<div class="list-row row-hover" data-action="view-appt" data-id="${a.id}"><div class="row-time">${a.time}</div><div class="row-main"><div class="row-title">${esc(a.name)}</div><div class="row-sub">${a.type} · ${esc(a.purpose)}</div></div>${statusTag(a.status)}</div>`).join('')}
    <div class="list-row row-hover" data-action="view-visit" data-id="VS-14"><div class="row-time">01:00 PM</div><div class="row-main"><div class="row-title">Jhajha constituency visit</div><div class="row-sub">Arrival, community meeting, infrastructure review</div></div><span class="tag tag-red">Visit</span></div>
  </div>
  `;
}

  } else if(caseModalTab==='Tasks'){
    body = rel_tasks.length ? rel_tasks.map(t=>`<div class="list-row"><div class="row-main"><div class="row-title">${esc(t.title)}</div><div class="row-sub">${t.owner} · Due ${t.due}</div></div>${priorityTag(t.priority)}</div>`).join('') + `<button class="btn btn-sm" style="margin-top:8px;" data-action="case-create-task" data-id="${c.id}">Create Task</button>` : `<div class="empty"><div class="empty-title">No linked tasks</div></div><button class="btn btn-sm" data-action="case-create-task" data-id="${c.id}">Create Task</button>`;

function aiAnswer(q){
  const ql = q.toLowerCase();
  if(ql.includes('jhajha road') || (ql.includes('jhajha') && ql.includes('happened'))){
    const c = findCase('CS-2201');
    return `Jhajha road issue (Case ${c.id}):\nStatus: ${c.status} · Priority: ${c.priority}\nRaised ${c.created}, last updated ${c.updated}.\nTimeline: ${c.timeline.map(t=>t.text).join(' → ')}\nNext action: ${c.nextAction}\nRelated correspondence: IP/JAM/2026/0048, awaiting response from Rural Development Dept.`;
  }
  if(ql.includes('pending') && ql.includes('jhajha')){
    const cases = DB.cases.filter(c=>c.location==='Jhajha' && c.status!=='Resolved');
    const corr = DB.correspondence.filter(c=>DB.cases.find(x=>x.id===c.relatedCase && x.location==='Jhajha') || c.relatedVisit==='VS-14');
    return `Pending matters related to Jhajha:\nCases (${cases.length}): ${cases.map(c=>`${c.id} (${c.category})`).join(', ')}\nCorrespondence (${corr.length}): ${corr.map(c=>c.ref).join(', ')}\nUpcoming visit: today, 1:00 PM.`;
  }
  if(ql.includes('priority') && ql.includes('today')){
    const highCases = DB.cases.filter(c=>c.priority==='High'&&c.status!=='Resolved');
    const approvals = DB.approvals.filter(a=>!['Dispatched','Rejected'].includes(a.stage));
    return `Today's priority items:\n— ${highCases.length} high-priority cases: ${highCases.map(c=>c.id).join(', ')}\n— ${approvals.length} items pending in the Approval Center\n— ${DB.tasks.filter(t=>t.bucket==='overdue'&&t.status==='open').length} overdue follow-up tasks`;
  }
  if(ql.includes('waiting') && ql.includes('department')){
    const corr = DB.correspondence.filter(c=>c.status==='Awaiting Response');
    return `Correspondence awaiting a department response:\n` + corr.map(c=>`— ${c.ref} · ${c.subject} · due ${c.due}`).join('\n');
  }
  if(ql.includes('tomorrow') && ql.includes('briefing')){
    return "Tomorrow's briefing:\n— No confirmed meetings yet; 1 pending request (Sono Traders follow-up)\n— Chakai school inauguration visit planned for 28 Sep\n— 2 tasks due\nWould you like me to draft calendar holds for the pending items?";
  }
  if(ql.includes('tomorrow')){
    return "Tomorrow currently has no confirmed meetings on the calendar. The Chakai visit is planned for 28 September, and 2 tasks are due tomorrow.";
  }
  if(ql.includes('jhajha') && ql.includes('week')){
    return "This week in Jhajha:\n— Today, 1:00 PM: Constituency visit (community meeting, infrastructure review, local delegation)\n— Ramesh Pandey (District Administration) at 9:30 AM regarding the Jhajha road stretch\n— Case CS-2201 (road) and CS-2131 (education) are both open in Jhajha";
  }
  if(ql.includes('pending') && ql.includes('case')){
    const old = DB.cases.filter(c=>c.days>15 && c.status!=='Resolved');
    return `${old.length} cases have been open more than 15 days:\n` + old.map(c=>`— ${c.id} · ${c.citizen} · ${c.category} · ${c.location} · ${c.days} days`).join('\n');
  }
  if(ql.includes('protocol') && ql.includes('draft')){
    return "Draft protocol communication — Jhajha visit:\n\n\"The office of Hon. Arun Bharti, MP, Jamui, wishes to inform the district administration and Jhajha police station of a scheduled constituency visit today, arriving 11:30 AM.\"\n\nThis draft is in the Approval Center awaiting staff review.";
  }
  if(ql.includes('meeting') && ql.includes('prepare')){
    return "To prepare for a specific person's meeting, open their profile from People and I'll summarize their history, open cases and past correspondence.";
  }
  if(ql.includes('birthday') || ql.includes('important date')){
    return `Today's important dates: ${DB.importantDates.map(d=>`${d.name} (${d.occasion})`).join(', ')}.`;
  }
  if(ql.includes('meeting') && (ql.includes('today') || ql.includes('how many'))){
    return `There are ${DB.appointments.length} meetings today: ${DB.appointments.map(a=>a.time).join(', ')}.`;
  }
  return "I can help with today's schedule, appointments, cases, documents, correspondence, visits and protocol status. Could you rephrase, or try one of the suggested questions below?";
}

function openModal(html, lg){
  const box=document.getElementById('modal-box');
  box.className = 'modal' + (lg?' modal-lg':'');
  box.innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');

function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); }
document.getElementById('modal-overlay').addEventListener('click',e=>{ if(e.target.id==='modal-overlay') closeModal(); });

/* =========================================================
   GLOBAL CLICK DELEGATION (works for #content AND modal)
========================================================= */
document.addEventListener('click', function(e){
  const navEl = e.target.closest('[data-nav]');
  const actEl = e.target.closest('[data-action]');

  if(navEl){
    route = navEl.dataset.nav; renderAll();
    if(navEl.dataset.action){ /* also has an action, fall through */ } else { return; }
  }
  if(!actEl) return;
  const a = actEl.dataset.action;
  const id = actEl.dataset.id, val = actEl.dataset.val, name = actEl.dataset.name, idx = actEl.dataset.idx;

  switch(a){
    case 'prepare-day': { const b=document.getElementById('briefing-box'); if(b) b.classList.add('show'); toast('Briefing prepared'); break; }

    case 'open-new-appt': openModal(modalNewAppointment()); break;
    case 'view-appt': openModal(modalViewAppointment(id)); break;
    case 'close-modal': closeModal(); break;
    case 'submit-appt': {
      const gv = elId=>document.getElementById(elId)?.value||'';
      const name_ = gv('f-name')||'New visitor', org=gv('f-org')||'—', type=gv('f-type'), time_=gv('f-time')||'TBD', priority=gv('f-priority'), purpose=gv('f-purpose')||'—';
      const nid = "AP-"+Math.floor(100+Math.random()*800);
      DB.appointments.push({id:nid,name:name_,org,phone:gv('f-phone')||'—',type,time:time_,status:"Pending",priority,purpose,completed:false});
      if(DB.capacity[type]) DB.capacity[type].used++;
      log(`PA created appointment ${nid} (${type} — ${name_})`);
      closeModal(); route="appointments"; renderAll(); toast('Appointment created');
      break;
    }
    case 'confirm-appt': { const ap=DB.appointments.find(x=>x.id===id); ap.status="Confirmed"; log(`Appointment ${ap.id} confirmed`); closeModal(); renderAll(); toast('Appointment confirmed'); break; }
    case 'reject-appt': { const ap=DB.appointments.find(x=>x.id===id); ap.status="Declined"; log(`Appointment ${ap.id} declined`); closeModal(); renderAll(); toast('Appointment declined'); break; }
    case 'prep-brief': {
      aiWork(actEl, 'Preparing meeting brief…', ()=>{
        const ap=DB.appointments.find(x=>x.id===id); const p=findPerson(ap.name);
        const slot=document.getElementById('meeting-brief-slot');
        if(slot) slot.innerHTML = `<div class="ai-box" style="margin-top:12px;">${aiChip('AI SUGGESTION','suggestion')}<div class="ai-text">Brief for ${ap.name}: ${p&&p.interactions.length? `${p.interactions.length} prior interaction(s) on file, most recently "${p.interactions[p.interactions.length-1].text}".`:'No prior interactions on file — first meeting with this office.'} Suggested focus: ${ap.purpose}</div></div>`;
        log(`AI prepared meeting brief for ${ap.name}`); toast('Meeting brief ready');
      });
      break;
    }
    case 'mark-completed': { closeModal(); const ap=DB.appointments.find(x=>x.id===id); openModal(modalMeetingNotes(ap.id)); break; }
    case 'gen-meeting-summary': {
      aiWork(actEl, 'Generating AI meeting summary…', ()=>{
        const ap=DB.appointments.find(x=>x.id===id);
        ap.completed=true; ap.status="Confirmed";
        const t1={id:"TK-"+Math.floor(600+Math.random()*300),title:`Contact District Administration re: ${ap.purpose}`,owner:"Constituency Coordinator",due:"25 September",priority:"Medium",source:`Meeting with ${ap.name}`,status:"open",bucket:"today"};
        const t2={id:"TK-"+Math.floor(600+Math.random()*300),title:"Prepare supporting document",owner:"Office Manager",due:"27 September",priority:"Medium",source:`Meeting with ${ap.name}`,status:"open",bucket:"upcoming"};
        const slot=document.getElementById('ai-summary-slot');
        if(slot) slot.innerHTML = `
          <div class="ai-box" style="margin-top:6px;">${aiChip('AI SUMMARY','summary')}
          <div class="ai-text">Meeting with ${ap.name} covered: ${ap.purpose}. Two action items were identified.</div>
          <div class="divider"></div>
          <div class="kv"><span class="k">Action 1</span><span class="v">Contact District Administration</span></div>
          <div class="kv"><span class="k">Owner</span><span class="v">Constituency Coordinator</span></div>
          <div class="kv"><span class="k">Deadline</span><span class="v">25 September</span></div>
          <div class="divider"></div>
          <div class="kv"><span class="k">Action 2</span><span class="v">Prepare supporting document</span></div>
          <div class="kv"><span class="k">Owner</span><span class="v">Office Manager</span></div>
          <div class="kv"><span class="k">Deadline</span><span class="v">27 September</span></div>
          </div>
          <button class="btn btn-primary btn-sm" data-action="create-all-tasks" data-t1="${t1.id}" data-t2="${t2.id}">Create all tasks</button>`;
        window.__pendingMeetingTasks = [t1,t2];
        log(`AI generated meeting summary for ${ap.name}`);
      });
      break;
    }
    case 'create-all-tasks': {
      (window.__pendingMeetingTasks||[]).forEach(t=>DB.tasks.push(t));
      log('2 tasks created from meeting summary');
      window.__pendingMeetingTasks=[];
      closeModal(); renderAll(); toast('Tasks created');
      break;
    }

    case 'case-filter': caseFilter=val; renderAll(); break;
    case 'people-filter': peopleFilter=val; renderAll(); break;
    case 'settings-tab': settingsTab=val; if(!navEl) renderAll(); break;
    case 'corr-tab': corrTab=val; renderAll(); break;

    case 'advance-protocol': {
      const steps=DB.protocol["VS-14"]; let d=DB.protocolProgress["VS-14"];
      if(d < steps.length){ DB.protocolProgress["VS-14"] = d+1; log(`Protocol advanced to '${steps[d]}'`); toast(steps[d]+' completed'); }
      renderAll();
      break;
    }

    case 'open-document': { window.__openDoc=id; const d=DB.documents.find(x=>x.id===id); d.status="Read"; renderAll(); break; }
    case 'analyze-doc': {
      aiWork(actEl, 'AI is reading the document…', ()=>{
        docExtracted[id]=true; log('AI extracted structured data from document');
        const d=DB.documents.find(x=>x.id===id); const slot=document.getElementById('doc-detail');
        if(slot) slot.innerHTML = docDetailHTML(d);
        toast('Document analyzed');
      });
      break;
    }
    case 'doc-action': {
      const d = DB.documents.find(x=>x.id===id); const label=d.extraction.actions[idx];
      log(`AI action executed: ${label}`); toast(`${label} — done`);
      actEl.textContent='Done'; actEl.disabled=true;
      break;
    }
    case 'simulate-upload': toast('Document received — added to inbox'); break;

    case 'prepare-greeting': toast(`Greeting drafted for ${name} — pending approval`); log(`AI drafted greeting for ${name}`); break;
    case 'send-template': { const c=DB.communications[idx]; if(c.approval){ toast('Sent for approval'); log(`Communication '${c.name}' sent for approval`);} else { toast('Sent'); log(`Communication '${c.name}' sent`);} break; }

    case 'complete-task': { const t=DB.tasks.find(x=>x.id===id); t.status="done"; log(`Task completed: ${t.title}`); renderAll(); toast('Task completed'); break; }
    case 'task-explain': {
      const t=DB.tasks.find(x=>x.id===id);
      toast(`Priority ${t.priority}: due ${t.due}, from ${t.source}`);
      break;
    }
    case 'explain-reports': {
      const slot=document.getElementById('report-explain');
      if(slot) slot.innerHTML = `<div class="ai-box">${aiChip('AI SUMMARY','summary')}<div class="ai-text">Cases resolved are up compared to last month, driven mainly by faster PWD responses in Jhajha. Overdue tasks remain low. No-shows are concentrated in Direct meeting slots.</div></div>`;
      break;
    }

    case 'set-capacity': break; /* handled by input event listener */

    case 'chat-send': sendChat(); break;
    case 'chat-suggest': { chatHistory.push({role:'user',text:val||name}); chatHistory.push({role:'ai',text:aiAnswer(val||name)}); renderAll(); scrollChat(); break; }

    /* ---- Office Inbox ---- */
    case 'open-inbox': inboxOpenId=id; renderAll(); break;
    case 'inbox-create-case': {
      aiWork(actEl, 'Creating case from AI analysis…', ()=>{
        const item = DB.inbox.find(x=>x.id===id);
        const nid = "CS-"+Math.floor(2210+Math.random()*90);
        const newCase = {id:nid,citizen:item.sender,location:item.aiAnalysis.area,category:"Road",status:"New",priority:item.aiAnalysis.priority,days:0,deadline:item.aiAnalysis.deadline,
          created:"25 Sep",updated:"25 Sep",nextAction:"Assign to "+item.aiAnalysis.suggestedOwner,
          timeline:[{date:"25 Sep",text:"Complaint received via "+item.source},{date:"25 Sep",text:"AI classified as "+item.aiAnalysis.category}],notes:[],docs:[]};
        DB.cases.push(newCase);
        item.relatedCase = nid; item.aiStatus="ASSIGNED"; item.assignedStaff=item.aiAnalysis.suggestedOwner;
        log(`Case ${nid} created from inbox item ${item.id}`);
        renderAll(); toast(`Case ${nid} created`);
      });
      break;
    }
    case 'inbox-create-task': {
      const item = DB.inbox.find(x=>x.id===id);
      const tid = "TK-"+Math.floor(700+Math.random()*90);
      DB.tasks.push({id:tid,title:`Follow up: ${item.subject}`,owner:item.aiAnalysis.suggestedOwner,due:item.aiAnalysis.deadline||"Soon",priority:item.priority,source:`Inbox ${item.id}`,status:"open",bucket:"today"});
      log(`Task ${tid} created from inbox item ${item.id}`);
      renderAll(); toast('Task created');
      break;
    }
    case 'inbox-assign': { const item=DB.inbox.find(x=>x.id===id); item.assignedStaff=item.aiAnalysis.suggestedOwner; item.aiStatus="ASSIGNED"; log(`Inbox item ${item.id} assigned to ${item.assignedStaff}`); renderAll(); toast('Assigned'); break; }
    case 'inbox-draft': {
      aiWork(actEl, 'AI is drafting a response…', ()=>{
        const item=DB.inbox.find(x=>x.id===id);
        const aid = "AC-"+Math.floor(4+Math.random()*90);
        DB.approvals.push({id:aid,title:`Response — ${item.subject}`,subtype:"Citizen Response",preparedBy:"AI Assistant",reviewedBy:"—",stage:"AI Prepared",relatedRef:null,relatedCase:item.relatedCase,relatedVisit:item.relatedVisit||null,
          content:`Dear ${item.sender},\n\nThank you for reaching out regarding "${item.subject}". The office has noted this matter and will follow up shortly.\n\nOffice of the Member of Parliament, Jamui`,
          history:[{time:"now",text:"AI prepared draft from inbox item "+item.id}]});
        item.aiStatus="WAITING";
        log(`AI drafted response for inbox item ${item.id} — sent to Approval Center`);
        renderAll(); toast('Draft created — sent to Approval Center');
      });
      break;
    }
    case 'inbox-calendar': { const item=DB.inbox.find(x=>x.id===id); log(`Calendar entry added from inbox item ${item.id}`); toast('Added to calendar'); break; }
    case 'inbox-complete': { const item=DB.inbox.find(x=>x.id===id); item.aiStatus="COMPLETED"; log(`Inbox item ${item.id} marked complete`); renderAll(); toast('Marked complete'); break; }

    /* ---- Case 360 ---- */
    case 'view-case': closeModal(); caseModalTab="Overview"; openModal(modalCaseDetail(id), true); break;
    case 'case-tab': caseModalTab=val; openModal(modalCaseDetail(id), true); break;
    case 'case-summarize': {
      aiWork(actEl, 'Re-summarizing case…', ()=>{
        openModal(modalCaseDetail(id), true); toast('Summary refreshed');
      });
      break;
    }
    case 'case-followup': {
      const c=findCase(id); c.timeline.push({date:"25 Sep",text:"AI suggested next follow-up: "+c.nextAction});
      const tid="TK-"+Math.floor(700+Math.random()*90);
      DB.tasks.push({id:tid,title:`Follow up on ${c.id} — ${c.nextAction}`,owner:"Case Manager",due:"In 3 days",priority:c.priority,source:`Case ${c.id}`,status:"open",bucket:"upcoming"});
      log(`Follow-up generated for case ${c.id}`);
      openModal(modalCaseDetail(id), true); toast('Follow-up task created');
      break;
    }
    case 'case-draft-letter': {
      aiWork(actEl, 'AI is drafting a letter…', ()=>{
        const c=findCase(id); const dept=findDept(CATEGORY_DEPT[c.category]);
        const aid="AC-"+Math.floor(4+Math.random()*90);
        DB.approvals.push({id:aid,title:`Draft letter — ${c.category} issue, ${c.location}`,subtype:"Draft Letter",preparedBy:"AI Assistant",reviewedBy:"—",stage:"AI Prepared",relatedRef:null,relatedCase:c.id,relatedVisit:null,
          content:`To ${dept?dept.officer.designation:'the concerned department'},\n\nThe office of Hon. Arun Bharti, MP, Jamui, forwards a constituent complaint (Case ${c.id}) regarding a ${c.category.toLowerCase()} issue in ${c.location}. We request an update at the earliest.\n\nRegards,\nOffice of the Member of Parliament, Jamui`,
          history:[{time:"now",text:"AI prepared draft from case "+c.id}]});
        c.timeline.push({date:"25 Sep",text:"AI drafted follow-up letter — sent to Approval Center"});
        log(`AI drafted letter for case ${c.id} — sent to Approval Center`);
        openModal(modalCaseDetail(id), true); toast('Draft sent to Approval Center');
      });
      break;
    }
    case 'case-create-task': {
      const c=findCase(id); const tid="TK-"+Math.floor(700+Math.random()*90);
      DB.tasks.push({id:tid,title:`Action required — ${c.id}`,owner:"Case Manager",due:"In 2 days",priority:c.priority,source:`Case ${c.id}`,status:"open",bucket:"today"});
      log(`Task created for case ${c.id}`);
      openModal(modalCaseDetail(id), true); toast('Task created');
      break;
    }
    case 'case-add-note': {
      const noteInput=document.getElementById('new-case-note'); const val_=noteInput?noteInput.value.trim():'';
      if(val_){ const c=findCase(id); c.notes.push(val_); log(`Note added to case ${c.id}`); }
      openModal(modalCaseDetail(id), true);
      break;
    }

    /* ---- Visit Command Center ---- */
    case 'view-visit': closeModal(); openModal(modalVisitDetail(id), true); break;
    case 'toggle-visit-check': { const v=findVisit(id); v.checklist[idx].done=!v.checklist[idx].done; openModal(modalVisitDetail(id), true); break; }
    case 'visit-brief': {
      aiWork(actEl, 'Generating visit briefing…', ()=>{
        const v=findVisit(id);
        const cases = DB.cases.filter(c=>c.location===v.place && c.status!=='Resolved').length;
        const corr = DB.correspondence.filter(c=>c.relatedVisit===v.id && c.status==='Awaiting Response').length || DB.correspondence.filter(c=>c.department && DB.cases.find(x=>x.location===v.place)).length;
        const prevMeetings = DB.appointments.filter(a=>a.org && a.org.toLowerCase().includes(v.place.toLowerCase())).length + 1;
        const slot = document.getElementById('visit-brief-text');
        if(slot) slot.textContent = `Before this visit, there are ${cases} relevant case(s), ${corr} pending department matter(s) and ${prevMeetings} previous meeting(s) associated with ${v.place}.`;
        log(`AI generated visit briefing for ${v.place}`);
      });
      break;
    }

    /* ---- Approval Center ---- */
    case 'approval-source': {
      const ap=DB.approvals.find(x=>x.id===id);
      openModal(`<div class="modal-head"><h3>${esc(ap.title)}</h3><button class="modal-close" data-action="close-modal">✕</button></div><div class="modal-body"><div class="ai-text" style="font-size:12.5px;">${esc(ap.content)}</div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Close</button></div>`);
      break;
    }
    case 'approval-audit': {
      const ap=DB.approvals.find(x=>x.id===id);
      openModal(`<div class="modal-head"><h3>Audit trail</h3><div class="mh-sub">${esc(ap.title)}</div><button class="modal-close" data-action="close-modal">✕</button></div><div class="modal-body">${ap.history.map(h=>`<div class="list-row"><div class="row-time">${h.time}</div><div class="row-main row-title">${esc(h.text)}</div></div>`).join('')}</div><div class="modal-foot"><button class="btn" data-action="close-modal">Close</button></div>`);
      break;
    }
    case 'approval-advance': {
      const ap=DB.approvals.find(x=>x.id===id);
      const i = APPROVAL_STAGES.indexOf(ap.stage);
      if(ap.stage==='Authorized Approval'){
        ap.stage='Dispatched';
        ap.history.push({time:"now",text:"Authorized user approved and dispatched"});
        if(ap.relatedRef){ const c=DB.correspondence.find(x=>x.ref===ap.relatedRef); if(c) c.status='Dispatched'; }
        if(ap.relatedCase){ const c=findCase(ap.relatedCase); if(c) c.timeline.push({date:"25 Sep",text:"Approved by authorized staff and dispatched"}); }
        log(`${ap.title} approved and dispatched`);
        toast('Approved and dispatched');
      } else {
        ap.stage = APPROVAL_STAGES[i+1];
        ap.history.push({time:"now",text:`Moved to ${ap.stage}`});
        log(`${ap.title} moved to ${ap.stage}`);
        toast(`Moved to ${ap.stage}`);
      }
      renderAll();
      break;
    }
    case 'approval-changes': { const ap=DB.approvals.find(x=>x.id===id); ap.stage='AI Prepared'; ap.history.push({time:"now",text:"Changes requested — returned to AI draft"}); log(`Changes requested on ${ap.title}`); renderAll(); toast('Sent back for changes'); break; }
    case 'approval-reject': { const ap=DB.approvals.find(x=>x.id===id); ap.stage='Rejected'; ap.history.push({time:"now",text:"Rejected by authorized user"}); log(`${ap.title} rejected`); renderAll(); toast('Rejected'); break; }

    /* ---- Person 360 / Department ---- */
    case 'view-person': closeModal(); openModal(modalPersonDetail(name), true); break;
    case 'view-dept': closeModal(); openModal(modalDeptDetail(id), true); break;
    case 'person-new-appt': {
      const nid="AP-"+Math.floor(100+Math.random()*800);
      DB.appointments.push({id:nid,name:name,org:"—",phone:"—",type:"Direct",time:"TBD",status:"Pending",priority:"Medium",purpose:"Follow-up meeting",completed:false});
      log(`Appointment ${nid} created for ${name}`); closeModal(); route="appointments"; renderAll(); toast('Appointment created');
      break;
    }
    case 'person-new-case': {
      const nid="CS-"+Math.floor(2210+Math.random()*90);
      DB.cases.push({id:nid,citizen:name,location:"Jamui Sadar",category:"Road",status:"New",priority:"Medium",days:0,deadline:"TBD",created:"25 Sep",updated:"25 Sep",nextAction:"Assign to case manager",timeline:[{date:"25 Sep",text:"Case created manually"}],notes:[],docs:[]});
      log(`Case ${nid} created for ${name}`); closeModal(); route="cases"; renderAll(); toast('Case created');
      break;
    }

    /* ---- Settings / Demo ---- */
    case 'reset-demo': {
      DB = JSON.parse(JSON.stringify(INITIAL_DB));
      route="command"; currentRole="pa"; caseFilter="all"; peopleFilter="all"; settingsTab="users"; corrTab="Incoming";
      docExtracted={}; window.__openDoc=null; inboxOpenId=null; caseModalTab="Overview";
      chatHistory=[{role:"ai",text:"Good morning. I can answer questions about today's schedule, cases, documents, correspondence and visits — only for data your role can access. Try one of the questions below, or type your own."}];
      const sel=document.getElementById('role-select'); if(sel) sel.dataset.init="";
      closeModal(); renderAll(); toast('Demo data reset');
      break;
    }
  }
});

function sendChat(){
  const inp=document.getElementById('chat-input'); if(!inp || !inp.value.trim()) return;
  const q=inp.value.trim(); chatHistory.push({role:'user',text:q});
  chatHistory.push({role:'ai',text:aiAnswer(q)});
  renderAll(); scrollChat();
}
function scrollChat(){ const l=document.getElementById('chat-log'); if(l) l.scrollTop=l.scrollHeight; }

/* input-based bindings that need re-attachment (delegated where possible via 'input'/'keydown') */
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('global-search').focus(); }
  if(e.target && e.target.id==='chat-input' && e.key==='Enter') sendChat();
});
document.addEventListener('input', e=>{
  if(e.target && e.target.dataset && e.target.dataset.action==='set-capacity'){
    DB.capacity[e.target.dataset.key].max = parseInt(e.target.value)||0; toast('Capacity updated');
  }
});

/* NOTIFICATIONS */
document.getElementById('notif-btn').addEventListener('click', e=>{
  e.stopPropagation();
  const p=document.getElementById('notif-panel');
  p.innerHTML = `<div class="notif-head">Notifications</div>` + DB.notifications.map(n=>`<div class="notif-item"><div class="ndot"></div><div><div>${esc(n.text)}</div><div class="notif-time">${n.time}</div></div></div>`).join('');
  p.classList.toggle('show');
});
document.addEventListener('click', e=>{ if(!e.target.closest('#notif-btn')) document.getElementById('notif-panel').classList.remove('show'); });

/* GLOBAL SEARCH */
document.getElementById('global-search').addEventListener('input', function(){
  const q=this.value.trim().toLowerCase();
  const box=document.getElementById('search-results');
  if(!q){ box.classList.remove('show'); return; }
  const appts = DB.appointments.filter(a=>a.name.toLowerCase().includes(q)||a.purpose.toLowerCase().includes(q));
  const cases = DB.cases.filter(c=>c.citizen.toLowerCase().includes(q)||c.category.toLowerCase().includes(q)||c.location.toLowerCase().includes(q));
  const people = DB.people.filter(p=>p.name.toLowerCase().includes(q)||p.role.toLowerCase().includes(q));
  const docs = DB.documents.filter(d=>d.name.toLowerCase().includes(q));
  const tasks = DB.tasks.filter(t=>t.title.toLowerCase().includes(q));
  const corr = DB.correspondence.filter(c=>c.subject.toLowerCase().includes(q)||c.recipient.toLowerCase().includes(q)||c.ref.toLowerCase().includes(q));
  const depts = DB.departments.filter(d=>d.name.toLowerCase().includes(q));
  const visits = DB.visits.filter(v=>v.place.toLowerCase().includes(q));
  const groups = [
    ["Appointments",appts.map(a=>`${a.name} — ${a.time}`)],
    ["Cases",cases.map(c=>`${c.id} · ${c.citizen} · ${c.category}`)],
    ["Correspondence",corr.map(c=>`${c.ref} · ${c.subject}`)],
    ["People",people.map(p=>`${p.name} — ${p.role}`)],
    ["Departments",depts.map(d=>d.name)],
    ["Visits",visits.map(v=>`${v.place} — ${v.date}`)],
    ["Documents",docs.map(d=>d.name)],
    ["Tasks",tasks.map(t=>t.title)]
  ].filter(g=>g[1].length);
  box.innerHTML = (groups.length ? groups.map(([label,items])=>`<div class="sr-group"><div class="sr-group-title">${label}</div>${items.map(i=>`<div class="sr-item">${esc(i)}</div>`).join('')}</div>`).join('') : `<div class="sr-group"><div class="sr-item" style="color:var(--text-faint);">No matches</div></div>`)
    + `<div class="sr-ask" data-action="chat-suggest" data-q="${esc(this.value)}">Ask AI about "${esc(this.value)}" →</div>`;
  box.classList.add('show');
});
document.addEventListener('click', e=>{ if(!e.target.closest('#search-wrap')) document.getElementById('search-results').classList.remove('show'); });
document.addEventListener('click', e=>{
  if(e.target.closest('.sr-ask')){ document.getElementById('search-results').classList.remove('show'); document.getElementById('global-search').value=''; }
});

/* INIT */
renderAll();
</script>
</body>
</html>
